name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (e.g., v1.0.0, v2.1.3)

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for Trusted Publishing (OIDC) and npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm for OIDC Trusted Publishing
        run: |
          # Clear any cached npm credentials to prevent stale token usage
          npm cache clean --force
          
          # Verify registry URL is set correctly
          npm config set registry "https://registry.npmjs.org"
          
          # Display current npm config for debugging
          echo "Current npm config:"
          npm config list --userconfig=$HOME/.npmrc
          
          echo "Contents of .npmrc:"
          cat $HOME/.npmrc || echo "No .npmrc found (expected - setup-node creates it)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "dist directory contents:"
          ls -la dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Verify npm authentication setup
        run: |
          echo "=== npm Registry Configuration ==="
          npm config get registry
          
          echo "=== npm Authentication Status ==="
          # Check if npm can authenticate with OIDC
          npm whoami 2>&1 || echo "⚠️ npm whoami failed (expected - will use OIDC token from GitHub Actions)"
          
          echo "=== .npmrc Status ==="
          if [ -f "$HOME/.npmrc" ]; then
            echo "✅ .npmrc exists"
            # Show .npmrc content (safe - only registry URLs, no secrets)
            cat "$HOME/.npmrc" | grep -v "_authToken\|_auth\|token" || true
          else
            echo "ℹ️ No .npmrc found - will use GitHub Actions OIDC token"
          fi
          
          echo "=== Environment Variables ==="
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-(not set, will use OIDC)}"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        # Note: Uses Trusted Publishing (OIDC) - no NPM_TOKEN needed
        # OIDC token is automatically requested from GitHub Actions
        # Requires npm.com configuration: https://docs.npmjs.com/generating-provenance-statements

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Tech Debt MCP v${{ steps.version.outputs.VERSION }}
            
            ### Installation Options
            
            **From npm (recommended):**
            ```bash
            npm install -g tech-debt-mcp@${{ steps.version.outputs.VERSION }}
            ```
            
            **From GitHub Packages:**
            First, create a `.npmrc` file in your home directory:
            ```
            @PierreJanineh:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=YOUR_GITHUB_TOKEN
            ```
            Then install:
            ```bash
            npm install -g @PierreJanineh/tech-debt-mcp@${{ steps.version.outputs.VERSION }}
            ```
            
            ### Package Links
            - **npm Registry:** https://www.npmjs.com/package/tech-debt-mcp/v/${{ steps.version.outputs.VERSION }}
            - **GitHub Packages:** https://github.com/PierreJanineh/TechDebtMCP/packages
            
            ### Documentation
            See [CHANGELOG.md](https://github.com/PierreJanineh/TechDebtMCP/blob/v${{ steps.version.outputs.VERSION }}/CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false

      - name: Notify success
        if: success()
        run: |
          echo "✅ Successfully published tech-debt-mcp@${{ steps.version.outputs.VERSION }} to npm"
          echo "📦 Package: https://www.npmjs.com/package/tech-debt-mcp"
          echo "🎉 GitHub Release: https://github.com/PierreJanineh/TechDebtMCP/releases/tag/v${{ steps.version.outputs.VERSION }}"
