name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (e.g., v1.0.0, v2.1.3)

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for Trusted Publishing (OIDC) and npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm  # Required for OIDC Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: |
          echo "Current npm version: $(npm -v)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "dist directory contents:"
          ls -la dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Verify mcpb/manifest.json version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./mcpb/manifest.json').version")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Error: mcpb/manifest.json version ($MANIFEST_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "MCPB manifest version verified: $MANIFEST_VERSION"

      - name: Build MCPB bundle
        run: npm run mcpb:pack

      - name: Verify MCPB artifact exists
        id: mcpb
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ARTIFACT="mcpb/tech-debt-mcp-${VERSION}.mcpb"
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: MCPB artifact not found at $ARTIFACT"
            exit 1
          fi
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_OUTPUT"
          ls -la "$ARTIFACT"

      - name: Upload MCPB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-debt-mcp-${{ steps.version.outputs.VERSION }}.mcpb
          path: ${{ steps.mcpb.outputs.ARTIFACT }}
          if-no-files-found: error

      - name: Detect prerelease tag
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          case "$VERSION" in
            *-*) echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Tech Debt MCP v${{ steps.version.outputs.VERSION }}

            ### Installation Options

            **From npm (recommended):**
            ```bash
            npm install -g tech-debt-mcp@${{ steps.version.outputs.VERSION }}
            ```

            **From GitHub Packages:**
            First, create a `.npmrc` file in your home directory:
            ```
            @PierreJanineh:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=YOUR_GITHUB_TOKEN
            ```
            Then install:
            ```bash
            npm install -g @PierreJanineh/tech-debt-mcp@${{ steps.version.outputs.VERSION }}
            ```

            ### Package Links
            - **npm Registry:** https://www.npmjs.com/package/tech-debt-mcp/v/${{ steps.version.outputs.VERSION }}
            - **GitHub Packages:** https://github.com/PierreJanineh/TechDebtMCP/packages

            ### Documentation
            See [CHANGELOG.md](https://github.com/PierreJanineh/TechDebtMCP/blob/v${{ steps.version.outputs.VERSION }}/CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE == 'true' }}

      - name: Attach MCPB to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.VERSION }}
          ARTIFACT: ${{ steps.mcpb.outputs.ARTIFACT }}
        run: gh release upload "$TAG" "$ARTIFACT" --clobber

      - name: Notify success
        if: success()
        run: |
          echo "✅ Successfully published tech-debt-mcp@${{ steps.version.outputs.VERSION }} to npm"
          echo "📦 Package: https://www.npmjs.com/package/tech-debt-mcp"
          echo "🎉 GitHub Release: https://github.com/PierreJanineh/TechDebtMCP/releases/tag/v${{ steps.version.outputs.VERSION }}"
