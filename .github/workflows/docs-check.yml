name: Docs Freshness Check

on:
  pull_request:
    branches:
      - develop

jobs:
  docs-check:
    runs-on: ubuntu-latest
    # Warning only -- never block merges
    continue-on-error: true

    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for src/ changes
        id: src_changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          SRC_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^src/' \
            | grep -Ev '__tests__/' \
            | head -1)

          if [ -n "$SRC_CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for doc changes
        id: doc_changes
        if: steps.src_changes.outputs.changed == 'true'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          REQUIRED_DOCS="CLAUDE.md ARCHITECTURE.md README.md ROADMAP.md CHANGELOG.md"
          DOC_TOUCHED=false

          for doc in $REQUIRED_DOCS; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx "$doc"; then
              DOC_TOUCHED=true
              break
            fi
          done

          if [ "$DOC_TOUCHED" = "false" ]; then
            echo "missing=$REQUIRED_DOCS" >> "$GITHUB_OUTPUT"
          else
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post warning comment
        if: |
          steps.src_changes.outputs.changed == 'true' &&
          steps.doc_changes.outputs.missing != ''
        uses: actions/github-script@v7
        env:
          MISSING_DOCS: ${{ steps.doc_changes.outputs.missing }}
        with:
          script: |
            const missing = process.env.MISSING_DOCS.trim().split(/\s+/);

            const docDescriptions = {
              'CLAUDE.md':       'Architecture tree, request flow, recipes (if new patterns introduced)',
              'ARCHITECTURE.md': 'Project structure, component descriptions, dependency graph, data flow',
              'README.md':       'Features list, tool/resource documentation, usage examples',
              'ROADMAP.md':      'Phase status, current status section, "Last Updated" date',
              'CHANGELOG.md':    'Add version entry when tagging a release',
            };

            const rows = missing
              .filter(f => f)
              .map(f => `| \`${f}\` | ${docDescriptions[f] || 'Review for needed updates'} |`)
              .join('\n');

            const body = [
              '## Documentation Freshness Warning',
              '',
              'This PR modifies files under `src/` but the following documentation files were **not updated**.',
              "Per the project's CLAUDE.md rule: *\"Do not defer docs to a separate PR \u2014 include them in the implementation PR.\"*",
              '',
              '| File | What to check |',
              '|------|---------------|',
              rows,
              '',
              '> **Note:** This is a non-blocking warning. Pure refactors, test-only, or config-only changes',
              '> may legitimately skip documentation updates \u2014 use your judgment.',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );

            const BOT_MARKER = '## Documentation Freshness Warning';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(BOT_MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Remove stale warning comment
        if: |
          steps.src_changes.outputs.changed != 'true' ||
          steps.doc_changes.outputs.missing == ''
        uses: actions/github-script@v7
        with:
          script: |
            const BOT_MARKER = '## Documentation Freshness Warning';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(BOT_MARKER)
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

      - name: Docs check summary
        if: always()
        env:
          SRC_CHANGED: ${{ steps.src_changes.outputs.changed }}
          MISSING_DOCS: ${{ steps.doc_changes.outputs.missing }}
        run: |
          echo "## Documentation Freshness Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SRC_CHANGED" != "true" ]; then
            echo "No \`src/\` changes detected -- docs check skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$MISSING_DOCS" ]; then
            echo "All required documentation files were updated in this PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Warning:** The following docs may need updating:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for doc in $MISSING_DOCS; do
              echo "- \`$doc\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
